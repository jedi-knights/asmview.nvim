name: Badge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  badge:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install neospec
        uses: ./.github/actions/install-neospec

      - name: Run tests and collect coverage
        id: neospec
        run: |
          set -euo pipefail
          OUTPUT_FILE="$RUNNER_TEMP/neospec_output.txt"
          if ! make test-coverage 2>&1 | tee "$OUTPUT_FILE"; then
            exit 1
          fi
          PCT="$(grep -oE 'Coverage: [0-9]+\.[0-9]+%' "$OUTPUT_FILE" \
            | grep -oE '[0-9]+\.[0-9]+' | head -1 || true)"
          echo "coverage-percentage=${PCT:-}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Generate HTML coverage report
        run: |
          sudo apt-get install -y --quiet lcov
          genhtml coverage/lcov.info -o htmlcov/ --quiet --ignore-errors source
        shell: bash

      - name: Upload Pages artifact
        if: success()
        id: upload-artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: htmlcov/

      - name: Deploy to GitHub Pages
        if: success() && steps.upload-artifact.outcome == 'success'
        id: deploy
        uses: actions/deploy-pages@v5
